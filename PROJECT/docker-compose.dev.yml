# Giai đoạn phát triển: chỉ chạy SQL Server + Keycloak bằng Docker.
# API (.NET) và giao diện (React) chạy trực tiếp trên máy để dễ debug.
#   (lần đầu) sao chép .env.example thành .env và điền mật khẩu
#   docker compose -f docker-compose.dev.yml up -d
name: hlt01
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hlt-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Chua co MSSQL_SA_PASSWORD - hay tao tep .env tu .env.example}"
      MSSQL_PID: "Developer"
    ports:
      - "1435:1433"
    volumes:
      - sqldata:/var/opt/mssql

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: hlt-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD:?Chua co KC_ADMIN_PASSWORD - hay tao tep .env tu .env.example}"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/hlt01-realm.json:/opt/keycloak/data/import/hlt01-realm.json:ro
      - ./keycloak/themes/hlt:/opt/keycloak/themes/hlt:ro

volumes:
  sqldata: